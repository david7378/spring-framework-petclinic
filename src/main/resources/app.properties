# Application settings for the legacy (VM) deployment.
# Filtered by Maven at build time, so like the JDBC settings they end up embedded in the WAR.
# Override with environment variables APP_UPLOADS_DIR / APP_REPORTS_DIR (or -Dapp.uploads.dir=...).
app.version=${project.version}
app.uploads.dir=/var/app/uploads
app.reports.dir=/var/app/reports
